<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обмен сессиями PW Hub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Обмен сессиями PW Hub</h1>
    <p id="status" class="status">Проверка подключения к PW Hub…</p>

    <section id="pairing" hidden>
      <label for="pairingCode">Код подключения</label>
      <input id="pairingCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
      <button id="connectButton" type="button">Подключить</button>
    </section>

    <section id="connected" hidden>
      <div class="account-label">Выбранный аккаунт PW Hub</div>
      <div id="accountName" class="account-name">Аккаунт не выбран</div>
      <button id="importButton" class="primary" type="button">Браузер → PW Hub</button>
      <button id="exportButton" class="primary export" type="button">PW Hub → браузер</button>
      <button id="refreshButton" class="secondary" type="button">Обновить аккаунт</button>
      <button id="disconnectButton" class="link" type="button">Отключить</button>
    </section>

    <p class="privacy">Обмениваются только cookies PW Online. Данные других сайтов не читаются и не изменяются.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
