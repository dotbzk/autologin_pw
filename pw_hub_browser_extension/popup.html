<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PW Hub Session Import</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>PW Hub Session Import</h1>
    <p id="status" class="status">Checking PW Hub…</p>

    <section id="pairing" hidden>
      <label for="pairingCode">Pairing code</label>
      <input id="pairingCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
      <button id="connectButton" type="button">Connect</button>
    </section>

    <section id="connected" hidden>
      <div class="account-label">Selected PW Hub account</div>
      <div id="accountName" class="account-name">No account selected</div>
      <button id="importButton" class="primary" type="button">Import Current PW Session</button>
      <button id="refreshButton" class="secondary" type="button">Refresh Account</button>
      <button id="disconnectButton" class="link" type="button">Disconnect</button>
    </section>

    <p class="privacy">Only PW Online cookies are transferred to the local PW Hub application.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
