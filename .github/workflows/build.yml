name: Build EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Build and test
        shell: pwsh
        run: .\src\build.ps1 -NoPause -FreshConfig
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLauncherBot
          path: client

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src/version.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version.json ($version)"
          }
          $archive = Join-Path $env:RUNNER_TEMP 'GameLauncherBot-win64.zip'
          Compress-Archive -Path 'client\*' -DestinationPath $archive -Force
          gh release create $env:GITHUB_REF_NAME $archive --title "GameLauncherBot $version" --generate-notes
